<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fb6e3c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ХУМУ" />
    <title>Кафе — заказы и токены</title>
    <script>
      // Ставим темы до первой отрисовки, чтобы не было вспышки:
      // "theme" — день/ночь, "app_theme"/"app_accent" — оформление заведения
      // (кэш последнего ответа /api/site/, пишет site.tsx).
      (function () {
        try {
          var el = document.documentElement;
          var t = localStorage.getItem("theme") || "light"; // по умолчанию светлая
          el.setAttribute("data-theme", t);
          var at = localStorage.getItem("app_theme");
          if (at) el.setAttribute("data-app-theme", at);
          var ac = localStorage.getItem("app_accent");
          if (ac && /^#[0-9a-fA-F]{6}$/.test(ac)) {
            var n = parseInt(ac.slice(1), 16);
            var mix = function (c) { return Math.round(c + (255 - c) * 0.45); };
            var light =
              "#" +
              ((1 << 24) + (mix((n >> 16) & 255) << 16) + (mix((n >> 8) & 255) << 8) + mix(n & 255))
                .toString(16)
                .slice(1);
            el.style.setProperty("--brand-user", ac);
            el.style.setProperty("--brand-user-dark", light);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
