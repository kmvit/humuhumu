{% extends "admin/change_list.html" %}

{% block result_list %}
  {% if order_total_sum is not None %}
    <div class="module" style="margin: 0 0 10px; padding: 10px 14px; font-size: 13px;">
      <strong>Итого по выборке:</strong>
      заказов — {{ order_count }}, сумма — <strong>{{ order_total_sum|floatformat:2 }} ₽</strong>
    </div>
  {% endif %}
  {{ block.super }}
{% endblock %}
