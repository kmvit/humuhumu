services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-humu}
      POSTGRES_USER: ${POSTGRES_USER:-humu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    # ставим/досоставляем зависимости при старте (быстро, если уже установлены)
    # и поднимаем dev-сервер. Так `docker-compose up` сам подхватывает новые пакеты.
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      # node_modules — в отдельном постоянном volume (linux-бинарники),
      # не затирается хостовой папкой и переживает пересоздание контейнера
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
