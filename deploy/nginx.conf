server {
    listen 80;
    server_name _;

    # логотипы и фото блюд
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ——— API и админка Django ———
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ——— статика Django (нужна админке) и загруженные файлы ———
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    # ——— PWA: манифест и service worker ———
    # Манифест и иконки приложения генерирует бэкенд из настроек заведения:
    # у каждого кафе своё имя, цвет и логотип, в сборку фронта их зашивать нельзя.
    # Не кэшируем (как index.html), иначе переименование заведения не доедет.
    location = /manifest.webmanifest {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/app-icon-[0-9]+(-maskable)?\.png$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # ——— собранный фронт (SPA) ———
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html НЕ кэшируем: иначе после деплоя браузер отдаёт старый html,
        # который ссылается на несуществующие /assets/*-<хеш> → белый экран.
        # Сами ассеты с хешем в имени кэшируются навечно (location /assets/ выше).
        add_header Cache-Control "no-cache";
    }
}
